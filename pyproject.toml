[project]
name = "auto-hand-router"
version = "0.1.0"
description = "Spacious curved two-layer KiCad 10 routing with validated manufacturing geometry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cairosvg>=2.7,<3",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "shapely>=2.1,<3",
]

[project.scripts]
auto-hand-router = "auto_hand_router.cli:main"

[project.optional-dependencies]
kreisel = [
    "kicad-autorouter @ git+https://github.com/J-Kreisel/kicad-autorouter@efd7f8e065f9bff88cd878aa2afd2ef12d23d678",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.15.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
